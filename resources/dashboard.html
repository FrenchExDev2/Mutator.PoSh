<!doctype html>
<html lang="__MUTATOR_LANGUAGE__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="5"><title>__MUTATOR_TITLE__</title>
<style>
:root{color-scheme:dark;--bg:#0c141c;--panel:#172530;--line:#304452;--ink:#e9f1f7;--muted:#a9bdcc;--green:#55d3ad;--red:#ff9292;--amber:#ffd080}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}main{max-width:1300px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:28px;margin:0}h2{font-size:20px}.note{color:var(--muted);line-height:1.6}.toolbar{display:flex;gap:12px;margin:24px 0;flex-wrap:wrap}input,select,button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:10px}input{min-width:260px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.card{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.value{font-size:30px;font-weight:650}.badge{display:inline-block;border-radius:20px;padding:4px 9px;background:#2a3b48;font-size:12px}.Success{color:var(--green)}.Failed,.Interrupted{color:var(--red)}.Running,.Starting{color:var(--amber)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}tr.run{cursor:pointer}tr.run:hover{background:var(--panel)}progress{width:150px;height:14px;accent-color:var(--green)}.detail{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:24px;padding:20px;overflow:auto}a{color:#8fcaff}code{overflow-wrap:anywhere}.error{color:var(--red)}.scroll{overflow:auto}small{font-size:12px}button{cursor:pointer}footer{margin-top:24px}@media(max-width:650px){header{display:block}main{padding:20px 12px}}
</style></head><body><main><header><div><h1>FrenchExDev Mutator</h1><p class="note" data-i18n="Subtitle"></p></div><p class="note" id="updated"></p></header>
<div class="cards" id="cards"></div><div class="toolbar"><input id="search" type="search"><select id="status"><option value="" data-i18n="AllStates"></option><option>Running</option><option>Starting</option><option>Success</option><option>Failed</option><option>Interrupted</option></select><select id="platform"><option value="" data-i18n="AllPlatforms"></option><option>windows</option><option>linux</option><option>macos</option></select></div>
<div class="scroll"><table><thead><tr><th data-i18n="Start"></th><th data-i18n="Platform"></th><th data-i18n="State"></th><th data-i18n="Modules"></th><th data-i18n="Mutants"></th><th data-i18n="Duration"></th></tr></thead><tbody id="runs"></tbody></table></div><p id="empty" class="note" data-i18n="Empty" hidden></p><section id="detail" class="detail" hidden></section>
<footer class="note"><small data-i18n="Footer"></small></footer></main>
<script id="data" type="application/json">__MUTATOR_DATA__</script><script>
const data=JSON.parse(document.getElementById('data').textContent), $=id=>document.getElementById(id);
const labels=data.Labels;
for(const element of document.querySelectorAll('[data-i18n]'))element.textContent=labels[element.dataset.i18n];
$('search').placeholder=labels.SearchPlaceholder;$('search').setAttribute('aria-label',labels.Search);
$('status').setAttribute('aria-label',labels.FilterState);$('platform').setAttribute('aria-label',labels.FilterPlatform);
const text=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value??'';if(cls)e.className=cls;return e};
const time=s=>s?new Intl.DateTimeFormat(data.Language,{dateStyle:'short',timeStyle:'medium',timeZone:'Europe/Paris'}).format(new Date(s)):'—';
const duration=r=>{if(r.Origin==='Imported')return '— (import)';const n=Math.max(0,Math.round(((r.CompletedUtc?new Date(r.CompletedUtc):new Date(data.GeneratedUtc))-new Date(r.CreatedUtc))/1000));return `${Math.floor(n/3600)} h ${Math.floor(n%3600/60)} min`};
const remember=JSON.parse(sessionStorage.getItem('mutatorFilters')||'{}');for(const id of ['search','status','platform'])if(remember[id])$(id).value=remember[id];
$('updated').textContent=labels.Updated+time(data.GeneratedUtc);
const memory=data.Runs.find(r=>r.HostMemory)?.HostMemory;
if(memory){const c=text('div','','card');c.append(text('div',labels.HostMemory,'note'),text('div',`${memory.UsedGB==null?'?':Number(memory.UsedGB).toFixed(1)} / ${memory.LimitGB} ${labels.GB}`,'value'),text('div',`${memory.Running?memory.Outcome:labels.WatchdogStopped} · ${labels.PreventiveThreshold} ${memory.TriggerGB} ${labels.GB}`,'note'));$('cards').append(c)}
for(const [name,value] of [[labels.Runs,data.Runs.length],[labels.Running,data.Runs.filter(r=>['Running','Starting'].includes(r.Outcome)).length],[labels.Success,data.Runs.filter(r=>r.Outcome==='Success').length],[labels.Failed,data.Runs.filter(r=>['Failed','Interrupted'].includes(r.Outcome)).length]]){const c=text('div','', 'card');c.append(text('div',name,'note'),text('div',value,'value'));$('cards').append(c)}
function show(r){const d=$('detail');d.replaceChildren();d.hidden=false;location.hash=encodeURIComponent(r.Id);d.append(text('h2',r.Id),text('p',r.Outcome+' · '+r.Platform+' · '+(r.Mode||'Full')+' · '+duration(r),'note'));if(r.Error)d.append(text('p',r.Error,'error'));const t=document.createElement('table');const h=document.createElement('tr');for(const x of [labels.Module,labels.Phase,labels.State,labels.MutantCount,labels.Score])h.append(text('th',x));t.append(h);for(const p of r.Packages){if(p.Recheck)d.append(text('p',Recheck:  | Killed:  | Survivors:  | Score: n/a,'note'));const runtime=p.ExecutionRuntime==='Pending'?`Pending (${p.RequiredRuntime})`:(p.ExecutionRuntime||p.Container?.Engine||'Host');d.append(text('p',`${p.Name} · ${runtime}`,'note'));if(p.Container?.HostReportDirectory)d.append(text('p',p.Container.HostReportDirectory,'note'));const tr=document.createElement('tr');for(const x of [p.Name,p.Phase,p.Outcome,`${p.EvaluatedMutants??0} / ${p.PlannedMutants??'?'}`,`${p.PSMutant?.Score??'—'} / ${p.Stryker?.Score??'—'}`])tr.append(text('td',x));t.append(tr);if(p.Container){const c=p.Container,l=c.ResourceLimits,row=document.createElement('tr'),cell=text('td',`${p.Platform||r.Platform} · ${labels.Connection} ${c.Connection||labels.Default} · RAM ${l?.Memory?`${l.MemoryMiB||'?'} ${labels.MemoryLimit}`:labels.Reservation}`,'note');cell.colSpan=5;row.append(cell);t.append(row)}if(p.Error){const row=document.createElement('tr'),cell=text('td',p.Error,'error');cell.colSpan=5;row.append(cell);t.append(row)}}d.append(t);const link=text('a',labels.RunReport);link.href=r.Report;d.append(text('p',labels.Reports),link,text('p',r.Path,'note'));const cmd=text('code',`Get-MutatorProgress -Path '${r.Path.replaceAll("'","''")}'`);d.append(cmd);}
function render(){const q=$('search').value.toLowerCase(),state=$('status').value,platform=$('platform').value;sessionStorage.setItem('mutatorFilters',JSON.stringify({search:$('search').value,status:state,platform}));const runs=data.Runs.filter(r=>(!state||r.Outcome===state)&&(!platform||r.Platform===platform)&&(!q||(r.Id+' '+r.Packages.map(p=>p.Name).join(' ')).toLowerCase().includes(q)));$('runs').replaceChildren();$('empty').hidden=runs.length>0;for(const r of runs){const row=text('tr','','run');row.tabIndex=0;const id=text('td',r.Id);id.append(text('div',time(r.CreatedUtc),'note'));const state=text('td','');state.append(text('span',r.Outcome,'badge '+r.Outcome));const count=text('td',`${r.CompletedPackages}/${r.TotalPackages} `);const bar=document.createElement('progress');bar.max=r.TotalPackages||1;bar.value=r.CompletedPackages;count.append(document.createElement('br'),bar);row.append(id,text('td',r.Platform),state,count,text('td',r.Mode==='Recheck'?`Recheck ${r.RecheckedMutants??'?'} | Survivors ${r.RecheckSurvivedMutants??'?'}`:`${r.EvaluatedMutants??0} / ${r.PlannedMutants??0}`),text('td',duration(r)));row.onclick=()=>show(r);row.onkeydown=e=>{if(e.key==='Enter')show(r)};$('runs').append(row)}}
for(const id of ['search','status','platform'])$(id).addEventListener('input',render);render();const selected=data.Runs.find(r=>r.Id===decodeURIComponent(location.hash.slice(1)));if(selected)show(selected);
</script></body></html>
